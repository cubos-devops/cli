name: Image

# Reusable workflow: builds one image for amd64 and arm64 on native runners (no QEMU
# emulation) and, on release, publishes the multi-platform manifest to GHCR.

on:
  workflow_call:
    inputs:
      name:
        description: Short name of the image, used in job and artifact names
        type: string
        required: true
      dockerfile:
        description: Dockerfile path, relative to the repository root (build context)
        type: string
        required: true
      image:
        description: Image repository on GHCR
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Docker Metadata 🧾
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}

      - name: Set up Docker Buildx 📦
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry 🔑
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push by digest 🚀
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'release' }}
          cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.name }}-${{ matrix.arch }},mode=max

      - name: Export digest 📤
        if: github.event_name == 'release'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest 📦
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download digests 📥
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.name }}-*
          merge-multiple: true

      - name: Docker Metadata 🧾
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          tags: |
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Set up Docker Buildx 📦
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest 🚀
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          args=()
          while read -r tag; do
            args+=(-t "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")

          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect manifest 🔍
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
